{% extends 'base.html' %}
{% block content %}
<table>
    <thead>
        <tr>
            <th colspan="3">Books Detail</th>
        </tr>
        <tr>
            <th>Book Name</th>
            <th>Level</th>
            <th>Price</th>
        </tr>
    </thead>
    <tbody>
        {%for book in books%}
        <tr>
            <td>{{book.name}}</td>
            <td>{{book.level}}</td>
            <td>${{book.price}}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
