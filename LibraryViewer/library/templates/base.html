{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Viewer</title>
    <style>
        *{
            font-family: sans-serif;
            padding: 5px;
        }
        img{
            width: 200px;
        }
        .header{
            color: white;
        }
        .header img{
            margin: 0 auto;
        }
        .header h2{
            margin-top: 0px;
            font-variant: small-caps;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: rgb(7, 7, 59); 
        }
        nav{
            background-color: rgb(171, 255, 163);
            padding:0px;
            line-height:50px;
        }
        nav li{
            list-style-type: none;
            display: inline;
            padding: 0px 20px 0px 20px;
        }
        nav li a{
            text-decoration: none;
            color: black;
            font-size: large;
        }
        nav li a:hover{
            text-decoration: underline;
        }
        footer{
            line-height: 20px;
            background-color: rgb(171, 255, 163);
            margin-top: 10px;
        }
        .main{
            text-align:justify;
            margin-top:10px;
        }
        table{
            border: 1px solid black;
            padding: 10px;
            border-collapse: collapse;
            margin:0 auto;
        }
        table th{
            background-color: rgb(171, 255, 163);
            text-align:center;
        }
        table th,td{
            padding: 10px;
            border: 3px solid black;
        }
    </style>
</head>
<body>
    <center>
        <div class="header">
            <img src="{%static 'images/bookLogo.png'%}" alt=""> <h2>My Library</h2>
            <nav>
                <ul>
                    <li><a href="{% url 'home' %}">Home</a></li>
                    <li><a href="{% url 'about' %}">About</a></li>
                    <li><a href="{% url 'books' %}">Books</a></li>
                </ul>
            </nav>
        </div>
        <div class="main">
                {%block content%}
                {%endblock%}
        </div>
        <footer>
            <p>Copyright &copy; act.All rights reserved. Practice Project by <b>Zohaib khan</b></p>
        </footer>
    </center>
</body>
</html>
